[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "benchmark-tabpfn-medical"
version = "0.0.1"
description = "Benchmarking TabPFN on medical tabular data"
readme = "README.md"
authors = [{name = "Alireza Ghorbani", email = "ghorbani.alireza@campus.lmu.de"}]
license = {text = "MIT"}
requires-python = ">=3.11"

# Dependencies are in requirements.txt — install with:
#   pip install -r requirements.txt
dependencies = []

[project.optional-dependencies]
dev = ["pytest", "ruff"]
[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "benchmark-tabpfn-medical"
version = "0.0.1"
description = "Benchmarking TabPFN on medical tabular data"
readme = "README.md"
authors = [{name = "Alireza Ghorbani", email = "alireza.ghorbani@lmu.de"}]
license = "MIT"
requires-python = ">=3.13,<3.14"
dependencies = [
    "catboost==1.2.10",
    "xgboost==3.4.1",
    "scikit-learn==1.7.2",
    "joblib==1.6.0",
    "numpy==2.5.3",
    "pandas==2.3.3",
    "scipy==1.18.1",
    "matplotlib==3.11.2",
    "plotly==7.1.0",
    "tqdm==4.70.1",
    "huggingface-hub==1.33.0",
    "safetensors==0.8.0",
    "certifi==2026.7.22",
    "tabpfn-common-utils[telemetry-interactive]==0.2.23",
    "kditransform==1.2.0",
    "einops==0.8.2",
    "eval-type-backport==0.4.0",
    "pydantic==2.13.5",
    "pydantic-settings==2.15.0",
    "typing-extensions==4.16.0",
    "filelock==4.0.7",
    "lightgbm==4.7.0",
    "skrub==0.10.1",
    "tabicl==2.2.0",
    "torch>=2.5",
    "networkx>=3",
    "packaging>=24",
    "pyyaml==6.0.3",
    "threadpoolctl==3.7.0",
    "exaonetabular @ git+https://github.com/LGAI-Research/EXAONE-Tabular.git@8638e07d09fad154249bd75ba4786181491f7025",

]

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.11", "build>=1.2"]
notebook = ["jupyterlab>=4", "ipykernel>=6", "jinja2>=3"]

[tool.setuptools.packages.find]
where = ["src", "vendor"]
include = ["benchmark*", "quadro*", "tabpfn_v25*", "tabpfn_v26*", "tabpfn_v3*", "tabpfn_v35*"]

[tool.setuptools.package-data]
"*" = ["*.pt", "*.json", "*.yaml", "*.yml", "*.txt", "LICENSE*", "COPYING*", "NOTICE*"]

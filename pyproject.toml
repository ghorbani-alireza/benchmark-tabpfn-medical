[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "benchmark-tabpfn-medical"
version = "0.0.1"
description = "Benchmarking TabPFN on medical tabular data"
readme = "README.md"
authors = [{name = "Alireza Ghorbani", email = "ghorbani.alireza@campus.lmu.de"}]
license = {text = "MIT"}
requires-python = ">=3.13.15"
dependencies = [
    "catboost==1.2.10",
    "huggingface_hub==1.30.0",
    "joblib==1.5.3",
    "matplotlib==3.10.0",
    "numpy==2.1.3",
    "pandas==2.2.3",
    "plotly==5.24.1",
    "scikit-learn==1.6.1",
    "scipy==1.16.3",
    "seaborn==0.13.2",
    "tabpfn==6.0.6",
    "tabpfn-client==0.5.3",
    "torch @ https://download.pytorch.org/whl/cpu/torch-2.11.0%2Bcpu-cp313-cp313-manylinux_2_28_x86_64.whl",
    "tqdm==4.67.3",
    "xgboost==3.2.0",
]

[project.optional-dependencies]
dev = ["pytest", "ruff"]